<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <script>
        // Minimal Supabase client implementation
        window.supabase = {
            createClient: function(url, key) {
                return {
                    from: function(table) {
                        const headers = {
                            'apikey': key,
                            'Authorization': 'Bearer ' + key,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        };
                        
                        return {
                            select: function(columns) {
                                return {
                                    order: function(column, options) {
                                        return {
                                            then: async function(resolve) {
                                                try {
                                                    const response = await fetch(url + '/rest/v1/' + table + '?select=' + columns + '&order=' + column + '.' + (options.ascending ? 'asc' : 'desc'), {
                                                        method: 'GET',
                                                        headers: headers
                                                    });
                                                    const data = await response.json();
                                                    if (!response.ok) {
                                                        resolve({ data: null, error: data });
                                                    } else {
                                                        resolve({ data: data, error: null });
                                                    }
                                                } catch (error) {
                                                    resolve({ data: null, error: error });
                                                }
                                            }
                                        };
                                    }
                                };
                            },
                            upsert: function(data) {
                                return {
                                    then: async function(resolve) {
                                        try {
                                            const response = await fetch(url + '/rest/v1/' + table, {
                                                method: 'POST',
                                                headers: headers,
                                                body: JSON.stringify(data)
                                            });
                                            const result = await response.json();
                                            if (!response.ok) {
                                                resolve({ data: null, error: result });
                                            } else {
                                                resolve({ data: result, error: null });
                                            }
                                        } catch (error) {
                                            resolve({ data: null, error: error });
                                        }
                                    }
                                };
                            },
                            delete: function() {
                                return {
                                    eq: function(column, value) {
                                        return {
                                            then: async function(resolve) {
                                                try {
                                                    const response = await fetch(url + '/rest/v1/' + table + '?' + column + '=eq.' + value, {
                                                        method: 'DELETE',
                                                        headers: headers
                                                    });
                                                    if (!response.ok) {
                                                        const result = await response.json();
                                                        resolve({ data: null, error: result });
                                                    } else {
                                                        resolve({ data: null, error: null });
                                                    }
                                                } catch (error) {
                                                    resolve({ data: null, error: error });
                                                }
                                            }
                                        };
                                    }
                                };
                            }
                        };
                    }
                };
            }
        };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .currency-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #eee;
        }

        .currency-selector label {
            font-weight: 500;
            color: #666;
        }

        .currency-selector select {
            padding: 8px 12px;
            border: 2px solid #eee;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }

        .currency-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .summary-card {
            flex: 1;
            min-width: 200px;
            background: linear-gradient(135deg, #2c5282 0%, #2d3748 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .summary-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .summary-card .amount {
            font-size: 2em;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #2c5282;
            border-bottom-color: #2c5282;
            font-weight: 600;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .subscriptions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .subscriptions-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .table-header {
            background: linear-gradient(135deg, #2c5282 0%, #2d3748 100%);
            color: white;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr 1.5fr 2fr;
            padding: 15px 20px;
            font-weight: 600;
            gap: 15px;
            align-items: center;
        }

        .table-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr 1.5fr 2fr;
            padding: 15px 20px;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s;
        }

        .table-row:hover {
            background: #f8f9ff;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-cell {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .table-cell-main {
            font-weight: 600;
            color: #333;
        }

        .table-cell-sub {
            font-size: 0.85em;
            color: #666;
        }

        .table-amount {
            font-size: 1.2em;
            font-weight: 700;
            color: #2c5282;
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .table-actions .btn {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .add-subscription-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #2c5282 0%, #2d3748 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .add-subscription-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 82, 130, 0.4);
        }

        .add-subscription-btn .icon {
            font-size: 1.3em;
        }

        .view-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sort-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-controls label {
            font-weight: 500;
            color: #666;
        }

        .sort-controls select {
            padding: 8px 12px;
            border: 2px solid #eee;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            background: white;
        }

        .sort-controls select:focus {
            outline: none;
            border-color: #2c5282;
        }

        .subscription-card {
            background: white;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .subscription-card:hover {
            border-color: #2c5282;
            box-shadow: 0 8px 25px rgba(44, 82, 130, 0.2);
            transform: translateY(-2px);
        }

        .subscription-card.add-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            cursor: pointer;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e0 100%);
            border: 2px dashed #2c5282;
        }

        .add-card:hover {
            background: linear-gradient(135deg, #2c5282 0%, #2d3748 100%);
        }

        .add-icon {
            font-size: 3em;
            color: #2c5282;
            transition: all 0.3s;
        }

        .add-card:hover .add-icon {
            color: white;
            transform: rotate(90deg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .card-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .card-plan {
            display: inline-block;
            padding: 4px 12px;
            background: #2c5282;
            color: white;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .card-info {
            margin: 10px 0;
            color: #666;
        }

        .card-info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.95em;
        }

        .card-info-label {
            font-weight: 500;
            color: #888;
        }

        .card-amount {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c5282;
            margin: 15px 0;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-unsubscribe {
            background: #ff4757;
            color: white;
        }

        .btn-unsubscribe:hover {
            background: #e03e4a;
        }

        .btn-edit {
            background: #eee;
            color: #333;
        }

        .btn-edit:hover {
            background: #ddd;
        }

        .btn-reactivate {
            background: #2ed573;
            color: white;
        }

        .btn-reactivate:hover {
            background: #26b862;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2c5282;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2c5282 0%, #2d3748 100%);
            color: white;
            padding: 12px 24px;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 82, 130, 0.4);
        }

        .btn-secondary {
            background: #eee;
            color: #333;
            padding: 12px 24px;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .category-entertainment { background: #fef3c7; color: #92400e; }
        .category-productivity { background: #dbeafe; color: #1e40af; }
        .category-fitness { background: #d1fae5; color: #065f46; }
        .category-music { background: #fce7f3; color: #9f1239; }
        .category-other { background: #e5e7eb; color: #374151; }

        .analysis-section {
            margin-top: 30px;
        }

        .analysis-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        .analysis-controls select {
            padding: 10px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1em;
        }

        .chart-container {
            background: white;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bar-label {
            min-width: 150px;
            font-weight: 500;
            color: #555;
        }

        .bar-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar {
            height: 30px;
            background: linear-gradient(135deg, #2c5282 0%, #2d3748 100%);
            border-radius: 15px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: white;
            font-weight: 600;
            min-width: 60px;
        }

        .bar:hover {
            transform: scaleX(1.02);
            box-shadow: 0 4px 15px rgba(44, 82, 130, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 1.2em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #2c5282;
            font-size: 1.2em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error-message {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .currency-selector {
                width: 100%;
                justify-content: space-between;
            }

            .subscriptions-grid {
                grid-template-columns: 1fr;
            }

            .summary {
                flex-direction: column;
            }

            .bar-label {
                min-width: 100px;
                font-size: 0.9em;
            }

            .table-header {
                display: none;
            }

            .table-row {
                grid-template-columns: 1fr;
                padding: 15px;
                gap: 10px;
                border: 1px solid #eee;
                border-radius: 8px;
                margin-bottom: 10px;
            }

            .table-cell {
                display: grid;
                grid-template-columns: 100px 1fr;
                gap: 10px;
            }

            .table-cell::before {
                content: attr(data-label);
                font-weight: 600;
                color: #666;
            }

            .table-actions {
                grid-column: 1 / -1;
            }

            .view-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .add-subscription-btn {
                width: 100%;
                justify-content: center;
            }

            .sort-controls {
                width: 100%;
                justify-content: space-between;
            }

            .sort-controls select {
                flex: 1;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>💳 Subscription Tracker</h1>
            </div>
            <div class="currency-selector">
                <label>Currency:</label>
                <select id="currencySelect" onchange="changeCurrency()">
                    <option value="USD">$ USD</option>
                    <option value="EUR">€ EUR</option>
                    <option value="GBP">£ GBP</option>
                    <option value="JPY">¥ JPY</option>
                    <option value="KRW">₩ KRW</option>
                    <option value="CNY">¥ CNY</option>
                    <option value="INR">₹ INR</option>
                    <option value="AUD">$ AUD</option>
                    <option value="CAD">$ CAD</option>
                    <option value="CHF">₣ CHF</option>
                    <option value="SEK">kr SEK</option>
                    <option value="NZD">$ NZD</option>
                    <option value="MXN">$ MXN</option>
                    <option value="SGD">$ SGD</option>
                    <option value="HKD">$ HKD</option>
                    <option value="NOK">kr NOK</option>
                    <option value="TRY">₺ TRY</option>
                    <option value="RUB">₽ RUB</option>
                    <option value="BRL">R$ BRL</option>
                    <option value="ZAR">R ZAR</option>
                </select>
            </div>
        </header>

        <div class="summary">
            <div class="summary-card">
                <h3>Active Subscriptions</h3>
                <div class="amount" id="activeCount">0</div>
            </div>
            <div class="summary-card">
                <h3>Monthly Total</h3>
                <div class="amount" id="monthlyTotal">$0.00</div>
            </div>
            <div class="summary-card">
                <h3>Yearly Total</h3>
                <div class="amount" id="yearlyTotal">$0.00</div>
            </div>
        </div>

        <div id="errorMessage" style="display: none;" class="error-message"></div>

        <div class="tabs">
            <button class="tab active" data-tab="active">Active Subscriptions</button>
            <button class="tab" data-tab="past">Past Subscriptions</button>
            <button class="tab" data-tab="analysis">Analysis</button>
        </div>

        <div class="tab-content active" id="active-content">
            <div class="view-controls">
                <button class="add-subscription-btn" onclick="openModal()">
                    <span class="icon">+</span>
                    <span>Add New Subscription</span>
                </button>
                <div class="sort-controls">
                    <label>Sort by:</label>
                    <select id="sortOption" onchange="sortSubscriptions()">
                        <option value="paydate-asc">Pay Date (1st → 31st)</option>
                        <option value="paydate-desc">Pay Date (31st → 1st)</option>
                        <option value="amount-desc">Amount (High → Low)</option>
                        <option value="amount-asc">Amount (Low → High)</option>
                        <option value="name-asc">Name (A → Z)</option>
                        <option value="name-desc">Name (Z → A)</option>
                        <option value="category-asc">Category (A → Z)</option>
                        <option value="recent">Recently Added</option>
                    </select>
                </div>
            </div>
            <div id="activeTable"></div>
        </div>

        <div class="tab-content" id="past-content">
            <div id="pastTable"></div>
        </div>

        <div class="tab-content" id="analysis-content">
            <div class="analysis-section">
                <div class="analysis-controls">
                    <label>Analyze by:</label>
                    <select id="analysisType" onchange="updateAnalysis()">
                        <option value="category">Category</option>
                        <option value="name">Name</option>
                    </select>
                </div>

                <div class="chart-container">
                    <div class="chart-title">Spending Analysis</div>
                    <div class="bar-chart" id="analysisChart"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="subscriptionModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add Subscription</div>
            <form id="subscriptionForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="subName" required placeholder="e.g., Netflix">
                </div>
                <div class="form-group">
                    <label>Plan</label>
                    <input type="text" id="subPlan" required placeholder="e.g., Pro, Basic">
                </div>
                <div class="form-group">
                    <label>Bill Amount (<span id="currencySymbol">$</span>)</label>
                    <input type="number" id="subBill" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Pay Date</label>
                    <select id="subPayDate" required>
                        <option value="">Select day...</option>
                        <script>
                            for(let i = 1; i <= 31; i++) {
                                document.write(`<option value="${i}">${i}${i==1?'st':i==2?'nd':i==3?'rd':'th'}</option>`);
                            }
                        </script>
                    </select>
                </div>
                <div class="form-group">
                    <label>Classification</label>
                    <select id="subClassification" required>
                        <option value="">Select category...</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Productivity">Productivity</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Music">Music</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Connected Card</label>
                    <input type="text" id="subCard" required placeholder="e.g., Visa *1234, Mastercard *5678">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://hxxesrbufwblfnfmwrlk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4eGVzcmJ1ZndibGZuZm13cmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyNjQ5OTYsImV4cCI6MjA4MDg0MDk5Nn0.KivTmO4ZNwZnJ_6bR9y-FSUhabzWF6GLszv43UDn5Yw';
        
        // Wait for supabase to load
        let supabase;
        
        function initSupabase() {
            const { createClient } = window.supabase;
            supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // Data storage
        let subscriptions = [];
        let editingId = null;
        let currentCurrency = localStorage.getItem('currency') || 'USD';
        let isLoading = false;
        let currentSort = localStorage.getItem('sortOption') || 'paydate-asc';

        // Currency symbols
        const currencySymbols = {
            'USD': '$',
            'EUR': '€',
            'GBP': '£',
            'JPY': '¥',
            'KRW': '₩',
            'CNY': '¥',
            'INR': '₹',
            'AUD': '$',
            'CAD': '$',
            'CHF': '₣',
            'SEK': 'kr',
            'NZD': '$',
            'MXN': '$',
            'SGD': '$',
            'HKD': '$',
            'NOK': 'kr',
            'TRY': '₺',
            'RUB': '₽',
            'BRL': 'R$',
            'ZAR': 'R'
        };

        function formatCurrency(amount) {
            const symbol = currencySymbols[currentCurrency];
            const formatted = amount.toFixed(2);
            
            // For currencies like JPY and KRW that don't use decimals
            if (currentCurrency === 'JPY' || currentCurrency === 'KRW') {
                return `${symbol}${Math.round(amount).toLocaleString()}`;
            }
            
            // For currencies where symbol comes after
            if (['SEK', 'NOK'].includes(currentCurrency)) {
                return `${formatted} ${symbol}`;
            }
            
            return `${symbol}${formatted}`;
        }

        function changeCurrency() {
            currentCurrency = document.getElementById('currencySelect').value;
            localStorage.setItem('currency', currentCurrency);
            renderSubscriptions();
            updateSummary();
            updateAnalysis();
        }

        // Supabase functions
        async function loadSubscriptions() {
            try {
                isLoading = true;
                showLoading();
                
                const { data, error } = await supabase
                    .from('subscriptions')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                subscriptions = data.map(sub => ({
                    id: sub.id,
                    name: sub.name,
                    plan: sub.plan,
                    bill: parseFloat(sub.bill),
                    payDate: sub.pay_date,
                    classification: sub.classification,
                    card: sub.card,
                    active: sub.active,
                    createdAt: sub.created_at,
                    unsubscribedAt: sub.unsubscribed_at
                }));

                hideError();
                renderSubscriptions();
                updateSummary();
                updateAnalysis();
            } catch (error) {
                console.error('Error loading subscriptions:', error);
                showError('Failed to load subscriptions. Please refresh the page.');
            } finally {
                isLoading = false;
            }
        }

        async function saveToSupabase(subscription) {
            try {
                const dbSubscription = {
                    id: subscription.id,
                    name: subscription.name,
                    plan: subscription.plan,
                    bill: subscription.bill,
                    pay_date: subscription.payDate,
                    classification: subscription.classification,
                    card: subscription.card,
                    active: subscription.active,
                    created_at: subscription.createdAt,
                    unsubscribed_at: subscription.unsubscribedAt || null
                };

                const { error } = await supabase
                    .from('subscriptions')
                    .upsert(dbSubscription);

                if (error) throw error;
                
                return true;
            } catch (error) {
                console.error('Error saving subscription:', error);
                showError('Failed to save subscription. Please try again.');
                return false;
            }
        }

        async function deleteFromSupabase(id) {
            try {
                const { error } = await supabase
                    .from('subscriptions')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                
                return true;
            } catch (error) {
                console.error('Error deleting subscription:', error);
                showError('Failed to delete subscription. Please try again.');
                return false;
            }
        }

        function showLoading() {
            const activeTable = document.getElementById('activeTable');
            activeTable.innerHTML = '<div class="loading">Loading your subscriptions</div>';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Supabase
            initSupabase();
            
            // Set saved currency
            document.getElementById('currencySelect').value = currentCurrency;
            
            // Set saved sort option
            document.getElementById('sortOption').value = currentSort;
            
            // Load subscriptions from Supabase
            loadSubscriptions();
            
            // Tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabName = this.dataset.tab;
                    switchTab(tabName);
                });
            });

            // Form submission
            document.getElementById('subscriptionForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await saveSubscription();
            });
        });

        function switchTab(tabName) {
            // Update active tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            
            // Update active content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`${tabName}-content`).classList.add('active');

            if (tabName === 'analysis') {
                updateAnalysis();
            }
        }

        function openModal(id = null) {
            editingId = id;
            const modal = document.getElementById('subscriptionModal');
            const form = document.getElementById('subscriptionForm');
            
            // Update currency symbol in form
            document.getElementById('currencySymbol').textContent = currencySymbols[currentCurrency];
            
            if (id) {
                const sub = subscriptions.find(s => s.id === id);
                document.getElementById('modalTitle').textContent = 'Edit Subscription';
                document.getElementById('subName').value = sub.name;
                document.getElementById('subPlan').value = sub.plan;
                document.getElementById('subBill').value = sub.bill;
                document.getElementById('subPayDate').value = sub.payDate;
                document.getElementById('subClassification').value = sub.classification;
                document.getElementById('subCard').value = sub.card;
            } else {
                document.getElementById('modalTitle').textContent = 'Add Subscription';
                form.reset();
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('subscriptionModal').classList.remove('active');
            editingId = null;
        }

        async function saveSubscription() {
            const subscription = {
                id: editingId || Date.now(),
                name: document.getElementById('subName').value,
                plan: document.getElementById('subPlan').value,
                bill: parseFloat(document.getElementById('subBill').value),
                payDate: document.getElementById('subPayDate').value,
                classification: document.getElementById('subClassification').value,
                card: document.getElementById('subCard').value,
                active: true,
                createdAt: editingId ? subscriptions.find(s => s.id === editingId).createdAt : new Date().toISOString()
            };

            const success = await saveToSupabase(subscription);
            
            if (success) {
                closeModal();
                await loadSubscriptions();
            }
        }

        async function unsubscribe(id) {
            if (confirm('Are you sure you want to unsubscribe?')) {
                const sub = subscriptions.find(s => s.id === id);
                sub.active = false;
                sub.unsubscribedAt = new Date().toISOString();
                
                const success = await saveToSupabase(sub);
                
                if (success) {
                    await loadSubscriptions();
                }
            }
        }

        async function reactivate(id) {
            const sub = subscriptions.find(s => s.id === id);
            sub.active = true;
            delete sub.unsubscribedAt;
            
            const success = await saveToSupabase(sub);
            
            if (success) {
                await loadSubscriptions();
            }
        }

        async function deleteSubscription(id) {
            if (confirm('Permanently delete this subscription?')) {
                const success = await deleteFromSupabase(id);
                
                if (success) {
                    await loadSubscriptions();
                }
            }
        }

        function sortSubscriptions() {
            currentSort = document.getElementById('sortOption').value;
            localStorage.setItem('sortOption', currentSort);
            renderSubscriptions();
        }

        function getSortedSubscriptions(subs) {
            const sorted = [...subs];
            
            switch(currentSort) {
                case 'paydate-asc':
                    return sorted.sort((a, b) => parseInt(a.payDate) - parseInt(b.payDate));
                case 'paydate-desc':
                    return sorted.sort((a, b) => parseInt(b.payDate) - parseInt(a.payDate));
                case 'amount-desc':
                    return sorted.sort((a, b) => b.bill - a.bill);
                case 'amount-asc':
                    return sorted.sort((a, b) => a.bill - b.bill);
                case 'name-asc':
                    return sorted.sort((a, b) => a.name.localeCompare(b.name));
                case 'name-desc':
                    return sorted.sort((a, b) => b.name.localeCompare(a.name));
                case 'category-asc':
                    return sorted.sort((a, b) => a.classification.localeCompare(b.classification));
                case 'recent':
                    return sorted.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                default:
                    return sorted;
            }
        }

        function renderSubscriptions() {
            const activeTable = document.getElementById('activeTable');
            const pastTable = document.getElementById('pastTable');

            const activeSubs = getSortedSubscriptions(subscriptions.filter(s => s.active));
            const pastSubs = getSortedSubscriptions(subscriptions.filter(s => !s.active));

            // Render active subscriptions table
            if (activeSubs.length === 0) {
                activeTable.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">No active subscriptions. Click the button above to add one!</div></div>';
            } else {
                activeTable.innerHTML = `
                    <div class="subscriptions-table">
                        <div class="table-header">
                            <div>Name</div>
                            <div>Plan</div>
                            <div>Amount</div>
                            <div>Pay Date</div>
                            <div>Category</div>
                            <div>Card</div>
                            <div>Actions</div>
                        </div>
                        ${activeSubs.map(sub => createTableRow(sub, true)).join('')}
                    </div>
                `;
            }

            // Render past subscriptions table
            if (pastSubs.length === 0) {
                pastTable.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">No past subscriptions</div></div>';
            } else {
                pastTable.innerHTML = `
                    <div class="subscriptions-table">
                        <div class="table-header">
                            <div>Name</div>
                            <div>Plan</div>
                            <div>Amount</div>
                            <div>Pay Date</div>
                            <div>Category</div>
                            <div>Card</div>
                            <div>Actions</div>
                        </div>
                        ${pastSubs.map(sub => createTableRow(sub, false)).join('')}
                    </div>
                `;
            }
        }

        function createTableRow(sub, isActive) {
            const categoryClass = sub.classification.toLowerCase().replace(/\s+/g, '-');
            const ordinal = getOrdinal(sub.payDate);
            
            return `
                <div class="table-row">
                    <div class="table-cell">
                        <span class="table-cell-main">${sub.name}</span>
                    </div>
                    <div class="table-cell">
                        <span class="card-plan">${sub.plan}</span>
                    </div>
                    <div class="table-cell">
                        <span class="table-amount">${formatCurrency(sub.bill)}</span>
                    </div>
                    <div class="table-cell">
                        <span class="table-cell-main">${ordinal}</span>
                    </div>
                    <div class="table-cell">
                        <span class="category-badge category-${categoryClass}">${sub.classification}</span>
                    </div>
                    <div class="table-cell">
                        <span class="table-cell-sub">💳 ${sub.card}</span>
                    </div>
                    <div class="table-actions">
                        ${isActive ? `
                            <button class="btn btn-edit" onclick="openModal(${sub.id})">Edit</button>
                            <button class="btn btn-unsubscribe" onclick="unsubscribe(${sub.id})">Unsubscribe</button>
                        ` : `
                            <button class="btn btn-reactivate" onclick="reactivate(${sub.id})">Reactivate</button>
                            <button class="btn btn-unsubscribe" onclick="deleteSubscription(${sub.id})">Delete</button>
                        `}
                    </div>
                </div>
            `;
        }

        function getOrdinal(day) {
            const j = day % 10;
            const k = day % 100;
            if (j == 1 && k != 11) return day + "st";
            if (j == 2 && k != 12) return day + "nd";
            if (j == 3 && k != 13) return day + "rd";
            return day + "th";
        }

        function updateSummary() {
            const activeSubs = subscriptions.filter(s => s.active);
            const monthlyTotal = activeSubs.reduce((sum, sub) => sum + sub.bill, 0);
            
            document.getElementById('activeCount').textContent = activeSubs.length;
            document.getElementById('monthlyTotal').textContent = formatCurrency(monthlyTotal);
            document.getElementById('yearlyTotal').textContent = formatCurrency(monthlyTotal * 12);
        }

        function updateAnalysis() {
            const analysisType = document.getElementById('analysisType').value;
            const activeSubs = subscriptions.filter(s => s.active);
            const chartDiv = document.getElementById('analysisChart');

            if (activeSubs.length === 0) {
                chartDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">No active subscriptions to analyze</div></div>';
                return;
            }

            const data = {};
            
            activeSubs.forEach(sub => {
                const key = analysisType === 'category' ? sub.classification : sub.name;
                data[key] = (data[key] || 0) + sub.bill;
            });

            // Sort by amount
            const sortedData = Object.entries(data).sort((a, b) => b[1] - a[1]);
            const maxAmount = Math.max(...Object.values(data));

            chartDiv.innerHTML = sortedData.map(([key, amount]) => {
                const percentage = (amount / maxAmount) * 100;
                return `
                    <div class="bar-item">
                        <div class="bar-label">${key}</div>
                        <div class="bar-wrapper">
                            <div class="bar" style="width: ${percentage}%">
                                ${formatCurrency(amount)}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Close modal when clicking outside
        document.getElementById('subscriptionModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
